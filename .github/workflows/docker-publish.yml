name: Build and publish Docker image

# Publishes a multi-arch image to the GitHub Container Registry so the
# Raspberry Pi can `docker pull` it instead of building locally -- building
# this image on a Pi's own CPU is slow, and QEMU here does that work once.
#
# Pushing this branch (or main) publishes an image tagged with the branch
# name; pushing a git tag like v1.0.0 publishes semver tags.

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate the publish on the test suite -- never ship an image that fails
  # its own tests. Runs on amd64 (fast, native); the code is arch-neutral.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches the Dockerfile's python:3.12-slim
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # No network and no API keys, by design.
        run: python -m pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Skip publishing for pull requests -- build only, nothing pushed.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU lets this amd64 runner build the linux/arm64 image the Pi needs.
      # It is emulated, so the first build takes a while (~15-25 min); the
      # GitHub Actions cache below makes later builds much faster.
      #
      # If your account has native ARM runners available, you can drop QEMU
      # and split this into a per-architecture matrix for a large speed-up.
      # Check the current runner labels in GitHub's docs before switching --
      # they are not hardcoded here on purpose.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is the Raspberry Pi (64-bit OS only -- see README).
          # amd64 is included so the same image runs on a laptop for testing.
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "If \`docker pull\` fails with *denied* or *unauthorized* on the Pi,"
            echo "the package is still private: open the package page on GitHub →"
            echo "Package settings → Change visibility → Public. This is a one-time"
            echo "step; GHCR creates every new package private regardless of whether"
            echo "the repository itself is public."
          } >> "$GITHUB_STEP_SUMMARY"
