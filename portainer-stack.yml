# Portainer stack for linebot-lab.
#
# Portainer > Stacks > Add stack > Web editor. Paste this file and Deploy --
# NOTHING needs to be filled in to boot. The container comes up
# "unconfigured": it prints the first-boot admin password to the logs, and
# every setting (LINE, OneDrive/Entra, OCR, everything) is configured from
# the admin UI at http://<host>:${ADMIN_PORT:-8001} afterwards. See
# README.md "Setup" for the walkthrough.
#
# Two differences from the repo's docker-compose.yml, both deliberate:
#
#   1. No `env_file: .env`. There is no .env file next to a Portainer stack,
#      so anyone who prefers headless/env-var config uses Portainer's own
#      "Environment variables" editor instead (see the commented-out block
#      below) -- the admin UI is not required either way.
#   2. A NAMED VOLUME instead of a ./data bind mount. A relative bind path in
#      a Portainer stack resolves against Portainer's internal stack
#      directory on the Docker host, which is not where you expect and is
#      awkward to back up. The named volume also gets the right ownership for
#      free: the image creates /app/data owned by uid 1000 before dropping to
#      the non-root user, and Docker seeds a new named volume from the image
#      path, so there is no chown step to remember.

services:
  linebot-lab:
    image: ghcr.io/mrkaqz/linebot-lab:${IMAGE_TAG:-latest}
    container_name: linebot-lab
    restart: unless-stopped

    ports:
      # Left side (before the colon) is the HOST port -- change PUBLIC_PORT/
      # ADMIN_PORT below if 8000/8001 are already taken on this host. Right
      # side (8000/8001, after the colon) is the port INSIDE the container
      # and must NOT change -- it's hardcoded in app/main.py, and the
      # healthcheck below curls localhost:8000 from inside the container
      # where there's no conflict to avoid. These two are deploy-time only
      # (Docker port mappings, resolved before the app even starts) -- they
      # are NOT settable from the admin UI.
      #
      # PUBLIC (${PUBLIC_PORT:-8000}). /line/webhook, /oauth/callback,
      # /healthz. This is the port your Cloudflare tunnel (or other HTTPS
      # ingress) forwards -- if you remap it, point cloudflared at the new
      # port too: `cloudflared tunnel --url http://localhost:${PUBLIC_PORT}`.
      - "${PUBLIC_PORT:-8000}:8000"
      # ADMIN UI (${ADMIN_PORT:-8001}). Reach it on your LAN at
      # http://<host>:${ADMIN_PORT:-8001} -- if you remap it, that's where
      # the admin UI moves to. Do NOT add a tunnel ingress rule for this
      # port: behind a tunnel every request appears to come from 127.0.0.1,
      # so IP filtering cannot tell tunnel traffic from local traffic -- not
      # publishing it is the real boundary. A login is required regardless.
      - "${ADMIN_PORT:-8001}:8001"

    # environment:
    #   # Nothing here is required -- the admin UI configures all of it.
    #   # Uncomment anything you'd rather set headlessly instead; whatever
    #   # you leave unset here stays configurable in the UI, and a value set
    #   # in the UI takes precedence over one set here.
    #   LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
    #   LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    #   LINE_LAB_GROUP_ID: ${LINE_LAB_GROUP_ID:-}
    #   ADMIN_LINE_ID: ${ADMIN_LINE_ID:-}
    #
    #   # claude | gemini | tesseract. Only the selected backend needs a key;
    #   # tesseract needs none and keeps every photo inside the clinic.
    #   OCR_BACKEND: ${OCR_BACKEND:-tesseract}
    #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    #   GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    #
    #   # The Microsoft/Entra block -- see README.md "Entra ID app
    #   # registration". PUBLIC_BASE_URL derives both the OAuth redirect URI
    #   # and the LINE webhook URL; MS_REDIRECT_URI is an explicit override.
    #   MS_CLIENT_ID: ${MS_CLIENT_ID:-}
    #   PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    #   MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
    #   # Auto-generated and persisted on first boot if left unset -- see
    #   # README.md "Generate the OAuth setup secret". Only set this
    #   # yourself if you need a specific, stable value ahead of time.
    #   OAUTH_SETUP_SECRET: ${OAUTH_SETUP_SECRET:-}
    #
    #   TIMEZONE: ${TIMEZONE:-Asia/Bangkok}
    #   ONEDRIVE_ROOT: ${ONEDRIVE_ROOT:-/LabResults}
    #   SETUP_UI_EXPOSURE: ${SETUP_UI_EXPOSURE:-lan}
    #   LOG_LEVEL: ${LOG_LEVEL:-INFO}
    #
    #   # OPD_REGEX is deliberately not listed: its regex contains characters
    #   # that are awkward to pass through Portainer's variable editor, it has
    #   # a working default in the code, and the admin UI's Setup > General
    #   # page can change it (with a live "test regex" box).

    volumes:
      # SQLite DB (config, activity log, unfiled queue), the MSAL OneDrive
      # refresh-token cache, and the encryption/session key files. Back this
      # up: losing it means re-running OneDrive sign-in and reconfiguring.
      - linebot-data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # No memory limit on purpose: markitdown pulls in magika, which loads an
    # onnxruntime model at import time regardless of the OCR backend, and a
    # tight limit will OOM-kill it.

volumes:
  linebot-data:
