<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}linebot-lab admin{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if logged_in %}
<header class="topbar">
  <a class="brand" href="/">linebot-lab</a>
  <nav class="topnav">
    <a href="/">Dashboard</a>
    <a href="/unfiled">Unfiled</a>
    <a href="/setup/line">LINE</a>
    <a href="/setup/ocr">OCR</a>
    <a href="/setup/onedrive">OneDrive</a>
    <a href="/setup/general">General</a>
    <form method="post" action="/logout" class="logout-form"><button type="submit" class="link-button">Log out</button></form>
  </nav>
</header>
{% endif %}
<main class="content">
  {% if flashes %}
  <div class="flashes">
    {% for f in flashes %}
    <div class="flash flash-{{ f.category }}">{{ f.message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
