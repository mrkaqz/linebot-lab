services:
  linebot-lab:
    # Pulled from the GitHub Container Registry, NOT built here -- building
    # this image on a Raspberry Pi's own CPU is slow, so CI builds the
    # multi-arch (arm64 + amd64) image instead and the Pi just pulls it.
    # See .github/workflows/docker-publish.yml.
    #
    #   docker compose pull && docker compose up -d
    #
    # IMAGE_TAG defaults to `latest` (published from the main branch). Set it
    # in .env to run a specific build, e.g. a branch tag before you merge:
    #   IMAGE_TAG=claude-line-chatbot-lab-results-c5a1ck
    #
    # To build locally instead (for development), add the override file:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/mrkaqz/linebot-lab:${IMAGE_TAG:-latest}
    # Always-on clinic appliance -- must come back up after a reboot or a
    # power cut without anyone touching it.
    restart: unless-stopped
    ports:
      # Left side (before the colon) is the HOST port -- change PUBLIC_PORT/
      # ADMIN_PORT in .env if 8000/8001 are already taken on this host.
      # Right side (8000/8001, after the colon) is the port INSIDE the
      # container and must NOT change -- it's hardcoded in app/main.py, and
      # the healthcheck below curls localhost:8000 from inside the
      # container, where there's no conflict to avoid. These two are
      # deploy-time only (Docker port mappings, resolved before the app even
      # starts) -- they are NOT settable from the admin UI.
      #
      # PUBLIC (${PUBLIC_PORT:-8000}). /line/webhook, /oauth/callback,
      # /healthz only. This is the port cloudflared (or any other public
      # tunnel) forwards -- if you remap it, point cloudflared at the new
      # port too: `cloudflared tunnel --url http://localhost:${PUBLIC_PORT}`.
      - "${PUBLIC_PORT:-8000}:8000"
      # ADMIN UI (${ADMIN_PORT:-8001}). The whole setup/dashboard/unfiled-
      #       queue UI lives here. Publish it to the LAN only -- do NOT add a
      #       cloudflared ingress rule (or any other public forward) for
      #       this port. A Cloudflare tunnel makes every request look like it
      #       came from 127.0.0.1, so IP-based "LAN only" filtering cannot
      #       tell tunnel traffic from local traffic apart; keeping the
      #       admin UI off a forwarded port entirely is the actual boundary.
      #       Login is still required either way -- see SETUP_UI_EXPOSURE in
      #       .env.example for the (not recommended) alternative of exposing
      #       it publicly. If you remap this port, that's where the admin UI
      #       moves to: http://<host>:${ADMIN_PORT:-8001}.
      - "${ADMIN_PORT:-8001}:8001"
    # Compose 2.24+ required for this list-of-object env_file form.
    # `required: false` means the stack still starts with no .env present at
    # all -- nothing is required to boot (see README.md "Setup"); .env
    # remains fully supported for anyone who'd rather configure headlessly.
    env_file:
      - path: .env
        required: false
    volumes:
      # Persists the SQLite DB (including the config table and activity
      # log), the MSAL refresh-token cache, and the config-encryption /
      # session-secret key files across container rebuilds. Losing this
      # volume means re-running OneDrive sign-in and reconfiguring the admin
      # UI (a plain .env still works without it). Must be writable by the
      # container's non-root user (uid 1000) -- see README "Running on
      # Raspberry Pi".
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No memory limit set on purpose: the tesseract backend's onnxruntime
    # dependency (via markitdown/magika) loads a model at import time, and a
    # tight limit can OOM-kill it. Leave this unset/generous unless you've
    # measured actual usage on your Pi.
